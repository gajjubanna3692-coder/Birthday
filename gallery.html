<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff2e63;
            --dark: #0f0c29;
            --light: #f8f9fa;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: var(--light);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: var(--gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.5em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Container */
        .main-container {
            padding-top: 80px;
            min-height: 100vh;
        }

        /* Hero Section */
        .hero {
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #0f0c29, #302b63);
        }

        .hero-title {
            font-size: 3.5em;
            margin-bottom: 20px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-subtitle {
            font-size: 1.5em;
            max-width: 600px;
            margin: 0 auto 40px;
            opacity: 0.9;
        }

        /* Gallery Section */
        .gallery-section {
            padding: 80px 20px;
            background: linear-gradient(to bottom, #302b63, #24243e);
        }

        .section-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 60px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .gallery-item {
            position: relative;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(106, 17, 203, 0.4);
        }

        .gallery-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover .gallery-media {
            transform: scale(1.1);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .gallery-item:hover .gallery-overlay {
            transform: translateY(0);
        }

        .gallery-title {
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .gallery-description {
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* 3D Gallery */
        .three-d-section {
            padding: 80px 20px;
            background: linear-gradient(to bottom, #24243e, #0f0c29);
            position: relative;
            overflow: hidden;
        }

        .three-d-container {
            max-width: 1200px;
            margin: 0 auto;
            height: 600px;
            position: relative;
            perspective: 1000px;
        }

        .mirror-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            animation: rotateRing 40s infinite linear;
        }

        @keyframes rotateRing {
            0% { transform: translate(-50%, -50%) rotateY(0deg); }
            100% { transform: translate(-50%, -50%) rotateY(360deg); }
        }

        .mirror-panel {
            position: absolute;
            width: 200px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .mirror-panel:hover {
            transform: scale(1.1) translateZ(50px);
            box-shadow: 0 15px 40px rgba(106, 17, 203, 0.6);
        }

        .mirror-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.5s;
            filter: brightness(0.8);
        }

        .mirror-panel:hover .mirror-content {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        .mirror-reflection {
            position: absolute;
            top: 100%;
            width: 100%;
            height: 50%;
            transform: scaleY(-1);
            opacity: 0.3;
            filter: blur(3px);
            pointer-events: none;
            overflow: hidden;
            border-radius: 15px;
        }

        .mirror-reflection img,
        .mirror-reflection video {
            width: 100%;
            height: 200%;
            object-fit: cover;
        }

        /* Video Section */
        .video-section {
            padding: 80px 20px;
            background: linear-gradient(to bottom, #0f0c29, #302b63);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-10px);
        }

        .video-thumbnail {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .video-info {
            padding: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .video-title {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .video-description {
            opacity: 0.8;
        }

        /* Video Play Button Overlay */
        .video-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-card:hover .video-play-overlay {
            opacity: 1;
        }

        .play-button {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5em;
            transition: all 0.3s;
        }

        .video-card:hover .play-button {
            background: rgba(255, 46, 99, 0.7);
            transform: scale(1.1);
        }

        /* Footer */
        .footer {
            padding: 40px 20px;
            background: #0f0c29;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .footer-link {
            color: var(--light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-link:hover {
            color: var(--accent);
        }

        .copyright {
            opacity: 0.7;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            animation: zoomIn 0.3s;
            overflow-y: auto;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-media {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }

        .modal-text {
            margin-top: 20px;
            font-size: 1.2em;
            text-align: center;
            line-height: 1.8;
        }

        .modal-video {
            width: 100%;
            max-width: 800px;
            height: auto;
            border-radius: 10px;
        }

        .video-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .video-control-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 2em;
            cursor: pointer;
            color: white;
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: rgba(255,255,255,0.4);
            transform: rotate(90deg);
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .control-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }

            .hero-title {
                font-size: 2.5em;
            }

            .hero-subtitle {
                font-size: 1.2em;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .gallery-item {
                height: 250px;
            }

            .three-d-container {
                height: 400px;
            }

            .mirror-panel {
                width: 150px;
                height: 225px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }

            .control-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .modal-content {
                padding: 20px;
            }

            .video-controls {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2em;
            }

            .section-title {
                font-size: 2em;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .three-d-container {
                height: 300px;
            }

            .mirror-panel {
                width: 120px;
                height: 180px;
            }

            .modal-text {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader"></div>
        <p class="loading-text">Initializing....</p>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">Simran's Gallery</div>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#gallery" class="nav-link">Gallery</a>
                <a href="#3d-view" class="nav-link">3D View</a>
                <a href="#videos" class="nav-link">Videos</a>
            </nav>
        </div>
    </header>


        <!-- Gallery Section -->
        <section class="gallery-section" id="gallery">
            <h2 class="section-title">Image Gallery</h2>
            <div class="gallery-container">
                <div class="gallery-grid" id="galleryGrid">
                    <!-- Gallery items will be generated by JavaScript -->
                </div>
            </div>
        </section>

        <!-- 3D Gallery Section -->
        <section class="three-d-section" id="3d-view">
            <h2 class="section-title">3D View</h2>
            <div class="three-d-container">
                <div class="mirror-ring" id="mirrorRing">
                    <!-- Mirror panels will be generated by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Video Section -->
        <section class="video-section" id="videos">
            <h2 class="section-title">Video Memories</h2>
            <div class="video-grid" id="videoGrid">
                <!-- Video cards will be generated by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                
            </div>
            <p class="copyright">© 2023 Simran Gallery. All rights reserved.</p>
        </div>
    </footer>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">×</span>
            <div id="modalContent">
                <!-- Content will be added dynamically -->
            </div>
            <p class="modal-text" id="modalText"></p>
            <div class="video-controls" id="videoControls" style="display: none;">
                <button class="video-control-btn" onclick="playPauseVideo()" id="playPauseBtn">
                    <i class="fas fa-play"></i> Play
                </button>
                <button class="video-control-btn" onclick="muteUnmuteVideo()" id="muteBtn">
                    <i class="fas fa-volume-up"></i> Mute
                </button>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="control-btn" onclick="toggleRotation()" id="rotationBtn">Pause Rotation</button>
        <button class="control-btn" onclick="toggleMusic()" id="musicBtn">Play Music</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="happy-birthday-festive-music-414654.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Media data
        const mediaData = {
            images: [
                { src: 'img1.jpeg', },
                { src: 'img2.jpeg',  },
                { src: 'img3.jpeg',  },
                { src: 'img4.jpeg',  },
                { src: 'img11.jpeg',  },
                { src: 'img12.jpeg',  },
                { src: 'img14.jpeg',  },
                { src: 'img15.jpeg',  },
                { src: 'img6.jpeg',  }
            ],
            videos: [
                { src: 'video1.mp4', title: 'Memory 1', description: 'A beautiful moment captured forever', thumbnail: 'img23.jpeg' },
                { src: 'video2.mp4', title: 'Memory 2', description: 'Laughing until we cried', thumbnail: 'img27.jpeg' },
                { src: 'video3.mp4', title: 'Memory 3', description: 'Adventures together', thumbnail: 'img21.jpeg' }
            ],
            // Different images for 3D rotation
            threeDImages: [
                { src: 'img7.jpeg', title: 'Beautiful Memory' },
                { src: 'img8.jpeg', title: 'Laughing Together' },
                { src: 'img9.jpeg', title: 'Adventure Time' },
                { src: 'img18.jpeg', title: 'Sunset Moments' },
                { src: 'img13.jpeg', title: 'Fun Times' },
                { src: 'img21.jpeg', title: 'Dancing Memories' },
                { src: 'img16.jpeg', title: 'Special Moment' },
                { src: 'img25.jpeg', title: 'Happy Times' }
            ]
        };

        let isRotating = true;
        let isMusicPlaying = false;
        let currentVideo = null;

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            createGallery();
            create3DGallery();
            createVideoGallery();
            
            // Event listeners
            document.addEventListener('keydown', handleKeyPress);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') closeModal();
            });

            // Loading animation
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 2000);
        });

        // Create image gallery
        function createGallery() {
            const galleryGrid = document.getElementById('galleryGrid');
            
            mediaData.images.forEach((image, index) => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.onclick = () => openImageModal(image);
                
                galleryItem.innerHTML = `
                    <img class="gallery-media" src="${image.src}" alt="${image.title}">
                    <div class="gallery-overlay">
                        
                    </div>
                `;
                
                galleryGrid.appendChild(galleryItem);
            });
        }

        // Create 3D gallery with different images
        function create3DGallery() {
            const mirrorRing = document.getElementById('mirrorRing');
            
            mediaData.threeDImages.forEach((image, index) => {
                const angle = (index / mediaData.threeDImages.length) * Math.PI * 2;
                const radius = 300;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                const panel = document.createElement('div');
                panel.className = 'mirror-panel';
                panel.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${angle}rad)`;
                panel.onclick = () => openImageModal(image);
                
                panel.innerHTML = `
                    <img class="mirror-content" src="${image.src}" alt="${image.title}">
                    <div class="mirror-reflection">
                        <img src="${image.src}" alt="Reflection">
                    </div>
                `;
                
                mirrorRing.appendChild(panel);
            });
        }

        // Create video gallery
        function createVideoGallery() {
            const videoGrid = document.getElementById('videoGrid');
            
            mediaData.videos.forEach((video, index) => {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                
                videoCard.innerHTML = `
                    <img class="video-thumbnail" src="${video.thumbnail}" alt="${video.title}">
                    <div class="video-play-overlay">
                        <div class="play-button">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="video-info">
                        
                    </div>
                `;
                
                videoCard.addEventListener('click', () => openVideoModal(video));
                videoGrid.appendChild(videoCard);
            });
        }

        // Open image modal
        function openImageModal(image) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');
            const modalText = document.getElementById('modalText');
            const videoControls = document.getElementById('videoControls');
            
            modalContent.innerHTML = `<img class="modal-media" src="${image.src}" alt="${image.title}">`;
            modalText.textContent = image.description;
            videoControls.style.display = 'none';
            
            modal.classList.add('active');
        }

        // Open video modal
        function openVideoModal(video) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');
            const modalText = document.getElementById('modalText');
            const videoControls = document.getElementById('videoControls');
            const playPauseBtn = document.getElementById('playPauseBtn');
            
            modalContent.innerHTML = `
                <video class="modal-video" id="modalVideo" controls>
                    <source src="${video.src}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            `;
            modalText.textContent = video.description;
            videoControls.style.display = 'flex';
            
            // Set up video element
            currentVideo = document.getElementById('modalVideo');
            currentVideo.addEventListener('play', () => {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i> Pause';
            });
            currentVideo.addEventListener('pause', () => {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i> Play';
            });
            
            modal.classList.add('active');
            
            // Auto-play the video
            setTimeout(() => {
                if (currentVideo) {
                    currentVideo.play().catch(e => {
                        console.log("Autoplay prevented:", e);
                        playPauseBtn.innerHTML = '<i class="fas fa-play"></i> Play';
                    });
                }
            }, 500);
        }

        // Play/pause video in modal
        function playPauseVideo() {
            if (currentVideo) {
                if (currentVideo.paused) {
                    currentVideo.play();
                } else {
                    currentVideo.pause();
                }
            }
        }

        // Mute/unmute video in modal
        function muteUnmuteVideo() {
            if (currentVideo) {
                currentVideo.muted = !currentVideo.muted;
                const muteBtn = document.getElementById('muteBtn');
                if (currentVideo.muted) {
                    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i> Unmute';
                } else {
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i> Mute';
                }
            }
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');
            
            // Pause video if playing
            if (currentVideo) {
                currentVideo.pause();
                currentVideo = null;
            }
            
            modal.classList.remove('active');
            modalContent.innerHTML = '';
        }

        // Toggle ring rotation
        function toggleRotation() {
            const mirrorRing = document.getElementById('mirrorRing');
            const rotationBtn = document.getElementById('rotationBtn');
            
            isRotating = !isRotating;
            
            if (isRotating) {
                mirrorRing.style.animationPlayState = 'running';
                rotationBtn.textContent = 'Pause Rotation';
            } else {
                mirrorRing.style.animationPlayState = 'paused';
                rotationBtn.textContent = 'Resume Rotation';
            }
        }

        // Toggle background music
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicBtn');
            
            if (isMusicPlaying) {
                music.pause();
                musicBtn.textContent = 'Play Music';
            } else {
                music.play();
                musicBtn.textContent = 'Pause Music';
            }
            
            isMusicPlaying = !isMusicPlaying;
        }

        // Handle keyboard navigation
        function handleKeyPress(e) {
            switch(e.key) {
                case ' ':
                    toggleRotation();
                    break;
                case 'Escape':
                    closeModal();
                    break;
            }
        }
    </script>
</body>
</html>
